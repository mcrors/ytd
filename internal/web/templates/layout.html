{{ define "layout" }}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ytd</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="min-h-screen bg-base-100">

  <nav class="navbar bg-base-200 shadow-md px-4">
    <div class="navbar-start">
      <a href="/" class="btn btn-ghost text-xl font-bold">ytd</a>
    </div>
    <div class="navbar-end gap-2">
      <a href="/" class="btn btn-ghost btn-sm">Downloads</a>
    </div>
  </nav>

  <main class="container mx-auto p-6">
    {{ block "content" . }}{{ end }}
  </main>

  <div id="toast-container" class="toast toast-end toast-bottom z-50"></div>

</body>
</html>
{{ end }}
