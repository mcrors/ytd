services:
  ytd:
    build:
      context: .
      args:
        YTDLP_VERSION: "2024.08.06"
        FFMPEG_VERSION: "6.1.1"
      # platforms: ["linux/amd64"]  # uncomment if you need to force arch on Apple Silicon
    image: ytd:dev
    container_name: ytd
    ports:
      - "8080:8080"
    environment:
      - YTD_MEDIA_DIR=/data/media
      - YTD_DB_PATH=/data/ytdlp.db
      # yt-dlp runtime niceties
      - YTDLP_HOME=/var/cache/yt-dlp
      - TMPDIR=/var/tmp
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./data:/data
      - ytd_cache:/var/cache/yt-dlp
      - ytd_tmp:/var/tmp
      # - ./secrets/cookies.txt:/etc/yt/cookies.txt:ro
      # - ./secrets/.netrc:/etc/yt/.netrc:ro
      # - ./config.yaml:/app/config.yaml:ro
    # Distroless has no shell or curl — healthcheck is handled by the Makefile e2e-test target
    healthcheck:
      disable: true
    restart: on-failure:3
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    tmpfs:
      - /run
    # If your service accepts flags, you can override:
    # command: ["/usr/local/bin/ytd", "--addr", ":8080"]

volumes:
  ytd_cache:
  ytd_tmp:
